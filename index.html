<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body>
    <br>
    <div class="my-5 w-50 m-auto">
        <div class="input-group m-auto">
            <input type="text" id="inputVal" class="form-control" placeholder="Recipient's username"
                aria-label="Recipient's username" aria-describedby="button-addon2">
            <button class="btn btn-danger" type="submit" id="search">Search</button>
        </div>
    </div>
    <br>

    

    <div id="nothing" class="modal fade" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title font-bold text-lg" id="mod-title">
                        
                    </h5>
                </div>
                <div class="modal-body flex flex-col justify-center" id="mod-body">
                    
                </div>
            </div>
        </div>
    </div>


    <div class="row w-11/12">
        <div id="card-cont" class="gap-3 drop-shadow-xl col-9 d-flex justify-around flex-wrap">
            

        </div>
        <div class="col-2">
            <h2 class="text-center font-bold ">Total Card: <span id="count">0</span></h2>

            <div class="ml-5">
                <table class="table">
                    <thead>
                        <tr>
                            <th scope="col">SL</th>
                            <th scope="col">Name</th>
                        </tr>
                    </thead>
                    <tbody id="table">
                        
                    </tbody>
                </table>
            </div>
        </div>
    </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
    <script src="app.js"></script>
</body>

</html>
